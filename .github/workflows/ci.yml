name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site build doubles as the link checker: docusaurus.config.ts sets
  # `onBrokenLinks: 'throw'`, so a dangling internal link fails here rather
  # than on the deploy that runs after merge.
  build:
    name: Build site
    # On main, deploy.yml already builds before publishing — no need to do it
    # twice. This job exists to gate pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Compiles the doc snippets marked `compile` / `compile-fragment`, and every
  # snippet in the Agent Skill, against the published neva crate. See
  # ci/check-snippets.py for the conventions and why the two defaults differ.
  snippets:
    name: Compile Rust snippets
    runs-on: ubuntu-latest
    env:
      # bump alongside the version the docs describe
      NEVA_VERSION: "0.5.2"
      # The generated crates live in a temp dir outside the repo, so point
      # cargo at a fixed path we can actually cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.snippet-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and snippet target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          # No Cargo.lock to key on — the inputs are the neva version and the
          # generator itself.
          key: snippets-${{ runner.os }}-neva${{ env.NEVA_VERSION }}-${{ hashFiles('ci/check-snippets.py') }}
          restore-keys: |
            snippets-${{ runner.os }}-neva${{ env.NEVA_VERSION }}-
      - name: docs/ — the marked snippets
        run: python3 ci/check-snippets.py
      # The skill is read by a model, so its markdown carries no markers and
      # every block is checked instead. A block that cannot be self-contained
      # opts out with `<!-- snippet: skip -->`.
      - name: skill/ — every snippet
        run: >
          python3 ci/check-snippets.py --docs-dir skill
          --default-mode compile --default-features full

  # The skill ships as a zip built at site-build time; make sure it packages.
  skill-package:
    name: Package the Agent Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci/build-skill.py
