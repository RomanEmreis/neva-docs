<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moved — MCP 2026-07-28</title>
    <!--
      The RC-preview page was retired in neva 0.5.0: MCP 2026-07-28 is no
      longer a release candidate behind `proto-2026-07-28-rc`, it is the
      default protocol generation. Kept as a redirect so old links resolve.

      Served at the SLASHED url: /neva-docs/<locale?>/docs/rc-preview/
      The base for relative hrefs is therefore .../docs/rc-preview/, so the
      target needs `../`. Its sibling ../rc-preview.html covers the slashless
      form, where the base is .../docs/ and the target needs `./` instead.
      Keeping one file per url form means neither depends on whether the host
      redirects between them.

      Both targets stay relative so a single asset serves every locale:
      Docusaurus copies static/ into each locale's output root, so this file
      exists at /neva-docs/docs/... and /neva-docs/ru/docs/..., and the
      relative href keeps the locale prefix it was reached through.
    -->
    <link rel="canonical" href="../spec-2026-07-28" />
    <meta http-equiv="refresh" content="0; url=../spec-2026-07-28" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>
      This page moved to <a href="../spec-2026-07-28">MCP 2026-07-28</a>.
    </p>
  </body>
</html>
